<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une bouteille — Apogée Wine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <p><a class="muted" href="/">&larr; Retour à la cave</a></p>
        <h1>Ajouter une bouteille</h1>
        <form method="post" action="/bouteilles">
            <label for="nom">Nom / Cuvée *</label>
            <input type="text" id="nom" name="nom" required>

            <label for="domaine">Domaine / Producteur</label>
            <input type="text" id="domaine" name="domaine">

            <label for="millesime">Millésime</label>
            <input type="number" id="millesime" name="millesime" min="1900" max="2100">

            <label for="couleur">Couleur *</label>
            <select id="couleur" name="couleur" required>
                {% for c in couleurs %}
                <option value="{{ c.value }}">{{ c.value }}</option>
                {% endfor %}
            </select>

            <label for="region">Région</label>
            <input type="text" id="region" name="region">

            <label for="pays">Pays</label>
            <input type="text" id="pays" name="pays">

            <label for="cepages">Cépage(s)</label>
            <input type="text" id="cepages" name="cepages" placeholder="ex: Syrah, Grenache">

            <label for="prix_achat">Prix d'achat (€)</label>
            <input type="number" id="prix_achat" name="prix_achat" step="0.01" min="0">

            <label for="quantite">Quantité</label>
            <input type="number" id="quantite" name="quantite" value="1" min="1">

            <label for="date_achat">Date d'achat</label>
            <input type="date" id="date_achat" name="date_achat">

            <label for="note">Note</label>
            <textarea id="note" name="note" rows="3"></textarea>

            <button type="submit">Ajouter la bouteille</button>
        </form>
    </div>
</body>
</html>
